version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    labels: [dependencies, automated]
    open-pull-requests-limit: 10
    groups:
      shopify:
        patterns: ['@shopify/*']
      trpc:
        patterns: ['@trpc/*']
      testing:
        patterns: ['vitest', '@testing-library/*', 'fast-check', 'msw']
      prisma:
        patterns: ['@prisma/*', 'prisma']
      react-email:
        patterns: ['@react-email/*']
      security-patches:
        applies-to: security-updates
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [ci, dependencies]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    labels: [docker, dependencies]
